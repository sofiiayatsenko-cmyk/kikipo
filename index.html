<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Charge Catch</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at 50% 45%,#1B2333 0%,#0B0E15 70%);
  color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation
}
#field{position:fixed;inset:0}

/* HUD */
.hud{position:fixed;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:5}
.hint{padding:10px 18px;border-radius:22px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:15px;font-weight:600;color:rgba(255,255,255,.88);transition:opacity .4s}

/* battery */
.batteryWrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px;z-index:2;pointer-events:none}
.battery{position:relative;width:150px;height:270px;border-radius:30px;border:6px solid rgba(255,255,255,.9);padding:8px;transition:transform .15s}
.battery::before{content:"";position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:56px;height:14px;border-radius:7px 7px 0 0;background:rgba(255,255,255,.9)}
.battery.bump{transform:scale(1.06)}
.track{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.06)}
.fill{position:absolute;left:0;right:0;bottom:0;height:5%;border-radius:16px;background:var(--c,#FF453A);box-shadow:0 0 30px var(--c,#FF453A);transition:height .35s cubic-bezier(.2,.9,.3,1.1),background .4s,box-shadow .4s}
.fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.bigBolt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.95;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.pct{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,255,255,.15)}

/* bolts */
.bolt{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;padding:0;background:transparent;cursor:pointer;z-index:3;will-change:transform}
.bolt .glow{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.45),rgba(255,214,10,0) 70%);animation:pulse 1.4s ease-in-out infinite}
.bolt svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,214,10,.8))}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.fly{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:4;pointer-events:none;transition:transform .45s cubic-bezier(.5,0,.75,0),opacity .45s}
.spark{position:fixed;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:3px;background:#FFD60A;pointer-events:none;z-index:4;animation:spark .55s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.plus{position:fixed;z-index:4;pointer-events:none;font-size:20px;font-weight:800;color:#FFD60A;text-shadow:0 0 10px rgba(255,214,10,.7);animation:plus .8s ease-out forwards}
@keyframes plus{to{transform:translateY(-50px);opacity:0}}

/* win */
.win{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(5,8,14,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.win.on{display:flex;animation:fade .4s ease-out}
.winCard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 36px;border-radius:28px;background:rgba(28,28,30,.92);box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
.winCard h2{margin:6px 0 0;font-size:28px}
.winCard p{margin:0;color:rgba(255,255,255,.75);font-size:16px}
.again{margin-top:14px;height:50px;padding:0 32px;border:0;border-radius:25px;background:#30D158;color:#00210A;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
</style>
</head>
<body>
<div id="field"></div>

<div class="hud"><div class="hint" id="hint">Catch the bolts to charge the battery</div></div>

<div class="batteryWrap">
  <div class="battery" id="battery">
    <div class="track">
      <div class="fill" id="fill"></div>
      <div class="bigBolt" aria-hidden="true">
        <svg width="54" height="80" viewBox="0 0 24 36"><path d="M14 1L2 20h8l-2 15 13-20h-8z" fill="#fff"/></svg>
      </div>
    </div>
  </div>
  <div class="pct" id="pct">5%</div>
</div>

<div class="win" id="win">
  <div class="winCard">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#30D158"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>Fully charged!</h2>
    <p id="winText">100% in 0 s</p>
    <button class="again" id="again">Play again</button>
  </div>
</div>

<script>
(function () {
  var START = 5;          // starting charge, %
  var PER_BOLT = 5;       // charge per caught bolt, %
  var DRAIN = 0.6;        // charge lost per second, %
  var MAX_BOLTS = 7;

  var field = document.getElementById('field');
  var fill = document.getElementById('fill');
  var pct = document.getElementById('pct');
  var battery = document.getElementById('battery');
  var hint = document.getElementById('hint');
  var win = document.getElementById('win');

  var BOLT_SVG = '<span class="glow"></span><svg viewBox="0 0 24 36" aria-hidden="true"><path d="M14 1L2 20h8l-2 15 13-20h-8z" fill="#FFD60A" stroke="#FFF3B0" stroke-width="1.2" stroke-linejoin="round"/></svg>';

  var charge, bolts, running, startTime, last, caught;

  function color(c) {
    if (c < 20) return '#FF453A';
    if (c < 50) return '#FFD60A';
    return '#30D158';
  }

  function paint() {
    var c = Math.max(0, Math.min(100, charge));
    fill.style.height = Math.max(3, c) + '%';
    fill.style.setProperty('--c', color(c));
    pct.textContent = Math.round(c) + '%';
  }

  function batteryRect() { return battery.getBoundingClientRect(); }

  function spawn() {
    var W = innerWidth, H = innerHeight, r = batteryRect();
    var x, y, tries = 0;
    do {
      x = 40 + Math.random() * (W - 80);
      y = 80 + Math.random() * (H - 140);
      tries++;
    } while (tries < 30 && x > r.left - 60 && x < r.right + 60 && y > r.top - 90 && y < r.bottom + 120);
    var speed = 60 + Math.random() * 90 + caught * 2;
    var a = Math.random() * Math.PI * 2;
    var el = document.createElement('button');
    el.className = 'bolt';
    el.setAttribute('aria-label', 'Catch bolt');
    el.innerHTML = BOLT_SVG;
    var b = { el: el, x: x, y: y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, rot: Math.random() * 30 - 15, spin: (Math.random() - .5) * 90, born: performance.now() };
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); catchBolt(b); });
    field.appendChild(el);
    bolts.push(b);
    place(b, 0);
  }

  function place(b, scale) {
    b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px) rotate(' + b.rot + 'deg) scale(' + scale + ')';
  }

  function catchBolt(b) {
    if (!running || b.dead) return;
    b.dead = true;
    bolts.splice(bolts.indexOf(b), 1);
    b.el.remove();
    caught++;
    if (hint.style.opacity !== '0') hint.style.opacity = '0';

    // sparks + label
    for (var i = 0; i < 10; i++) {
      var s = document.createElement('span');
      s.className = 'spark';
      var ang = Math.random() * Math.PI * 2, d = 30 + Math.random() * 40;
      s.style.left = b.x + 'px'; s.style.top = b.y + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * d + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * d + 'px');
      document.body.appendChild(s);
      setTimeout(s.remove.bind(s), 600);
    }
    var p = document.createElement('span');
    p.className = 'plus'; p.textContent = '+' + PER_BOLT + '%';
    p.style.left = (b.x + 14) + 'px'; p.style.top = (b.y - 30) + 'px';
    document.body.appendChild(p);
    setTimeout(p.remove.bind(p), 850);

    // bolt flies into the battery
    var f = document.createElement('div');
    f.className = 'fly';
    f.innerHTML = '<svg viewBox="0 0 24 36" width="44" height="44" aria-hidden="true"><path d="M14 1L2 20h8l-2 15 13-20h-8z" fill="#FFD60A"/></svg>';
    f.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
    document.body.appendChild(f);
    var r = batteryRect();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = 'translate(' + (r.left + r.width / 2) + 'px,' + (r.top + r.height / 2) + 'px) scale(.4)';
        f.style.opacity = '.3';
      });
    });
    setTimeout(function () {
      f.remove();
      if (!running) return;
      charge = Math.min(100, charge + PER_BOLT);
      battery.classList.add('bump');
      setTimeout(function () { battery.classList.remove('bump'); }, 150);
      paint();
      if (charge >= 100) finish();
    }, 450);
  }

  function finish() {
    running = false;
    var secs = ((performance.now() - startTime) / 1000).toFixed(1);
    document.getElementById('winText').textContent = '100% in ' + secs + ' s · ' + caught + ' bolts caught';
    bolts.forEach(function (b) { b.el.remove(); });
    bolts = [];
    setTimeout(function () { win.classList.add('on'); }, 350);
  }

  function tick(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) {
      var W = innerWidth, H = innerHeight;
      bolts.forEach(function (b) {
        b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.spin * dt;
        if (b.x < 32) { b.x = 32; b.vx = Math.abs(b.vx); }
        if (b.x > W - 32) { b.x = W - 32; b.vx = -Math.abs(b.vx); }
        if (b.y < 32) { b.y = 32; b.vy = Math.abs(b.vy); }
        if (b.y > H - 32) { b.y = H - 32; b.vy = -Math.abs(b.vy); }
        place(b, Math.min(1, (now - b.born) / 250));
      });
      while (bolts.length < MAX_BOLTS) spawn();
      if (caught > 0) { charge = Math.max(1, charge - DRAIN * dt); paint(); }
    }
    requestAnimationFrame(tick);
  }

  function start() {
    (bolts || []).forEach(function (b) { b.el.remove(); });
    charge = START; bolts = []; caught = 0; running = true;
    startTime = performance.now();
    hint.style.opacity = '1';
    win.classList.remove('on');
    paint();
  }

  document.getElementById('again').addEventListener('click', start);
  start();
  last = performance.now();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
